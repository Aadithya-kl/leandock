[package]
name = "leandock"
version = "0.2.0"
edition = "2021"
rust-version = "1.78"
description = "Drop-in, zero-config, non-destructive resource optimizer wrapper for Docker Compose"
license = "MIT"
repository = "https://github.com/pvbang/leandock"
homepage = "https://github.com/pvbang/leandock"
documentation = "https://github.com/pvbang/leandock/tree/main/docs"
readme = "README.md"
keywords = ["docker", "docker-compose", "devops", "vps", "optimization"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "leandock"
path = "src/main.rs"

[dependencies]
# CLI & Terminal Output
clap = { version = "4.5", features = ["derive", "env"] }
owo-colors = "4.1"
comfy-table = "7.1"
indicatif = "0.17"

# Async Runtime & HTTP Reverse Proxy (Hyper v1)
tokio = { version = "1.40", features = [
    "rt-multi-thread",
    "net",
    "process",
    "sync",
    "time",
    "signal",
    "macros",
    "io-util",
    "fs",
] }
hyper = { version = "1.4", features = ["client", "server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "http1"] }
http-body-util = "0.1"
http = "1.1"
bytes = "1.7"
async-trait = "0.1"

# Serialization, Parsing & Time
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml_ng = "0.10"
humantime = "2.1"
chrono = { version = "0.4", features = ["serde"] }
flate2 = "1.0"

# Cross-Platform System Information
sysinfo = "0.32"

# Logging & Error Handling
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1.0"
thiserror = "2.0"

# Unix-Only Dependencies (strictly gated for Windows cross-compilation)
[target.'cfg(unix)'.dependencies]
nix = { version = "0.29", features = ["user"] }

[dev-dependencies]
tempfile = "3.13"
assert_cmd = "2.0"
predicates = "3.1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/leandock-v{ version }-{ target }.{ archive-format }"
bin-dir = "{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"
