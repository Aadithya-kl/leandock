[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "leandock"
version = "0.2.0"
description = "Drop-in, zero-config, non-destructive resource optimizer wrapper for Docker Compose"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.8"
keywords = ["docker", "docker-compose", "devops", "vps", "optimization", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Rust",
    "Topic :: System :: Systems Administration",
]

[project.urls]
Homepage = "https://github.com/leandock/leandock"
Repository = "https://github.com/leandock/leandock"
Documentation = "https://github.com/leandock/leandock/tree/main/docs"
Changelog = "https://github.com/leandock/leandock/blob/main/CHANGELOG.md"

[tool.maturin]
bindings = "bin"
manifest-path = "Cargo.toml"
strip = true
