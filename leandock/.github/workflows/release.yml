name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            archive: tar.gz
            bin: leandock
            use_cross: true
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            archive: tar.gz
            bin: leandock
            use_cross: true
          - os: macos-latest
            target: x86_64-apple-darwin
            archive: tar.gz
            bin: leandock
            use_cross: false
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz
            bin: leandock
            use_cross: false
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
            bin: leandock.exe
            use_cross: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross for static musl Linux builds
        if: matrix.use_cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build release binary
        shell: bash
        run: |
          if [ "${{ matrix.use_cross }}" = "true" ]; then
            cross build --release --target ${{ matrix.target }}
          else
            cargo build --release --target ${{ matrix.target }}
          fi

      - name: Package artifact & SHA256 checksum
        shell: bash
        run: |
          mkdir -p dist
          VERSION="${GITHUB_REF_NAME}"
          ARTIFACT="leandock-${VERSION}-${{ matrix.target }}"
          BIN_PATH="target/${{ matrix.target }}/release/${{ matrix.bin }}"
          if [ "${{ matrix.archive }}" = "tar.gz" ]; then
            tar -C "target/${{ matrix.target }}/release" -czf "dist/${ARTIFACT}.tar.gz" "${{ matrix.bin }}"
            sha256sum "dist/${ARTIFACT}.tar.gz" > "dist/${ARTIFACT}.tar.gz.sha256"
          else
            7z a "dist/${ARTIFACT}.zip" "${BIN_PATH}"
            sha256sum "dist/${ARTIFACT}.zip" > "dist/${ARTIFACT}.zip.sha256"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.target }}
          path: dist/*

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Consolidate SHA256SUMS
        run: |
          cd artifacts
          cat *.sha256 > SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/*
